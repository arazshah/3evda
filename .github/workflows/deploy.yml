name: Deploy

# Runs after CI succeeds on main. Coolify builds docker-compose.yml on the server;
# this workflow triggers it, waits for the new version to report healthy, and smoke-tests it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL || 'https://3evda.com' }}
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://3evda.com' }}
      EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_DEPLOY_URL/COOLIFY_TOKEN are not set; relying on Coolify auto-deploy (see docs/runbooks/coolify.md)."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" "${COOLIFY_DEPLOY_URL}" > /dev/null
          echo "Deployment requested."

      - name: Wait for the new version to go live
        run: |
          deadline=$(( $(date +%s) + 1200 ))
          until [ "$(date +%s)" -ge "$deadline" ]; do
            version=$(curl --silent --max-time 10 "${PUBLIC_URL}/api/health/live" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            if [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Live version is ${version}"
              exit 0
            fi
            echo "Live version: ${version:-unreachable}; waiting for ${EXPECTED_VERSION}…"
            sleep 20
          done
          echo "::error::${PUBLIC_URL} did not report version ${EXPECTED_VERSION} within 20 minutes. Check the Coolify deployment log, and that 'Include Source Commit in Build' is enabled."
          exit 1

      - name: Smoke test
        run: |
          set -e
          check() { code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "${PUBLIC_URL}$1"); echo "$1 -> $code"; test "$code" = "$2"; }
          check / 200
          check /en 200
          check /api/health/ready 200
          check /healthz 200

  # The scores that count are the ones on the real address, after the deploy. A page that fails here is open
  # work, not a rollback by itself (the site is already live and healthy). Note that the numbers are measured from
  # a GitHub runner, so the distance to the server in Iran adds to the loading time.
  lighthouse:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://3evda.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.28.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install the test tools
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Lighthouse on the live site (every public page at least 90)
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.PUBLIC_URL }}
          LIGHTHOUSE_SKIP_MISSING: "true"
        run: pnpm lighthouse
