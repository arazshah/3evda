name: Restore drill

# Proves the backup can actually be restored: back up a running stack, destroy its data volumes, restore,
# and compare rows, files, a gallery link and the admin sign-in. Weekly, on demand, and whenever the backup
# machinery changes. The result of the last good run is kept in docs/runbooks/restore-drill-log.md.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/restore-drill.yml"
      - "scripts/restore-drill.sh"
      - "docker-compose.yml"
      - "backend/Dockerfile"
      - "backend/scripts/**"
      - "backend/apps/core/backup*.py"
      - "backend/apps/core/management/commands/run_backup.py"
      - "backend/apps/core/management/commands/drill_data.py"

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway secrets
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 40)"
            echo "DJANGO_ALLOWED_HOSTS=localhost"
            echo "PUBLIC_URL=http://localhost:8080"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ACCESS_KEY=$(openssl rand -hex 12)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "RESTIC_PASSWORD=$(openssl rand -hex 24)"
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
          } > .env
      - name: Run the drill
        run: ./scripts/restore-drill.sh
      - name: Summary
        if: success()
        run: |
          {
            echo "### Restore drill passed"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo '```'
            cat drill-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Clean up
        if: always()
        run: docker compose down --volumes
