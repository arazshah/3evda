name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.0"
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: threevda
          POSTGRES_USER: threevda
          POSTGRES_PASSWORD: threevda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threevda" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install ffmpeg (video tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install dependencies
        run: uv sync --frozen
      - name: requirements.txt matches uv.lock
        # Comment lines are ignored: the generated header records the output path.
        run: >-
          diff -u
          <(grep -v '^#' requirements.txt)
          <(uv export --frozen --no-dev --no-emit-project --format requirements-txt -q | grep -v '^#')
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:run
      - name: Build
        run: pnpm build

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Regenerate the OpenAPI schema
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python manage.py spectacular --settings=config.settings.test \
            --format openapi-json --file openapi.json --validate --fail-on-warn
      - name: Regenerate the TypeScript API types
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm api:types
      - name: Committed contract is up to date
        run: |
          if ! git diff --exit-code -- backend/openapi.json frontend/src/lib/api/schema.d.ts; then
            echo "::error::The API contract changed. Run the two commands above and commit the results."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway secrets
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 40)"
            echo "DJANGO_ALLOWED_HOSTS=localhost"
            echo "PUBLIC_URL=http://localhost:8080"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ACCESS_KEY=$(openssl rand -hex 12)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "RESTIC_PASSWORD=$(openssl rand -hex 24)"
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
            echo "INQUIRY_RATE=1000/hour"
            echo "BOOKING_RATE=1000/hour"
          } > .env
      - name: Start the production stack
        run: docker compose -f docker-compose.yml -f compose.dev.yml up --build --wait --wait-timeout 300 -d
      - name: Containers run as non-root
        run: |
          for svc in api worker web; do
            uid=$(docker compose exec -T "$svc" id -u)
            echo "$svc uid=$uid"
            test "$uid" = "10001"
          done
      - name: Create the e2e admin
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "E2E_ADMIN_PASSWORD=${password}" >> "$GITHUB_ENV"
          docker compose exec -T -e ADMIN_BOOTSTRAP_PASSWORD="${password}" api \
            python manage.py bootstrap_admin --username e2e-admin --no-input
      - name: Seed the sample journal articles and price rules
        run: |
          docker compose exec -T -e ALLOW_DEMO_DATA=true api python manage.py seed_blog_demo
          docker compose exec -T -e ALLOW_DEMO_DATA=true api python manage.py seed_quote_demo
          docker compose exec -T -e ALLOW_DEMO_DATA=true api python manage.py seed_booking_demo
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
          E2E_EXPECTED_VERSION: ${{ github.sha }}
          E2E_ADMIN_USER: e2e-admin
        run: pnpm test
      - name: Lighthouse (every public page scores at least 90)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm lighthouse
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Python dependency audit
        run: uvx pip-audit==2.10.1 -r backend/requirements.txt --require-hashes --disable-pip --progress-spinner off
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Node dependency audit
        run: |
          (cd frontend && pnpm audit --audit-level high)
          (cd e2e && pnpm audit --audit-level high)
