<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>3evda Reel 4</title>
<style>
@font-face { font-family: Vazir; font-weight: 200; src: url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-200-normal.woff2); }
@font-face { font-family: Vazir; font-weight: 400; src: url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-400-normal.woff2); }
@font-face { font-family: Vazir; font-weight: 700; src: url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-700-normal.woff2); }
@font-face { font-family: Vazir; font-weight: 900; src: url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
@font-face { font-family: Bodoni; font-weight: 700; src: url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-700-normal.woff2); }
@font-face { font-family: Bodoni; font-style: italic; src: url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-italic.woff2); }
@font-face { font-family: Manrope; font-weight: 700; src: url(node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2); }
:root { --gold: #d9b878; --paper: #ece6dc; --ink: #0e0e0d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); color: #fff; font-family: Vazir, Manrope, sans-serif; }
.layer { position: absolute; inset: 0; }
.abs { position: absolute; }
.center { left: 0; right: 0; text-align: center; }
.sh { text-shadow: 0 6px 28px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.6); }
.wrap { position: absolute; inset: 0; transform-origin: 50% 50%; display: none; }
.cont { position: absolute; }
.cont img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cont svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cont svg * { fill: none; stroke: var(--gold); stroke-width: 5; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.lbl { position: absolute; white-space: nowrap; font: 700 36px Vazir; color: #fff; background: rgba(14,14,13,.78); padding: 10px 22px 14px;
  border-right: 6px solid var(--gold); transform-origin: 100% 50%; }
#shadeTop { background: linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.45) 22%, transparent 34%); }
#shadeBot { background: linear-gradient(transparent 58%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.9) 100%); }
#segs { top: 165px; left: 90px; right: 90px; display: flex; gap: 12px; direction: rtl; }
#segs i { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,.28); position: relative; overflow: hidden; display: block; }
#segs i b { position: absolute; top: 0; bottom: 0; right: 0; background: var(--gold); width: 0; }
#kicker { top: 215px; font: 700 26px Manrope; letter-spacing: .4em; color: var(--gold); direction: ltr; }
#title { top: 262px; font: 900 132px/1.25 Vazir; }
#title span { font-weight: 200; color: var(--gold); margin-left: 26px; }
#expl { top: 1365px; left: 90px; right: 90px; text-align: center; font: 400 46px/1.75 Vazir; color: var(--paper); }
#swatches { top: 1160px; left: 90px; right: 90px; display: flex; gap: 18px; justify-content: center; }
.sw { width: 205px; text-align: center; }
.sw i { display: block; height: 118px; border-radius: 10px; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.sw b { display: block; font: 700 28px Vazir; margin-top: 10px; }
.sw small { display: block; font: 700 22px Manrope; letter-spacing: .08em; color: rgba(255,255,255,.7); direction: ltr; }
#gridSvg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
#gridSvg line { stroke: rgba(255,255,255,.75); stroke-width: 3; }

#hookKick { top: 470px; font: 700 40px Vazir; color: var(--paper); }
#hookNum { top: 600px; white-space: nowrap; font: 900 230px/1.1 Vazir; color: var(--gold); }
#hookL1 { top: 900px; font: 900 112px/1.3 Vazir; }
#hookL2 { top: 1050px; font: 900 100px/1.3 Vazir; white-space: nowrap; }
#hookL2 em { font-style: normal; color: var(--gold); }
#hookTick { top: 1290px; font: 700 34px Manrope; letter-spacing: .5em; color: rgba(255,255,255,.8); direction: ltr; }

.strip { position: absolute; top: 0; width: 216px; height: 1920px; overflow: hidden; }
.strip img { position: absolute; height: 1920px; left: 50%; transform: translateX(-50%); }
#mosaicText { top: 760px; z-index: 5; }
#mosaicText div { font: 900 92px/1.4 Vazir; }
#mosaicText em { font-style: normal; color: var(--gold); }

#endName { top: 470px; font: 200 132px/1.3 Vazir; }
#endRole { top: 670px; font: 400 50px Vazir; color: var(--paper); }
#endUrl { top: 820px; left: 130px; right: 130px; height: 176px; border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center;
  font: 700 116px Bodoni; color: var(--gold); direction: ltr; }
#endList { top: 1060px; font: 400 42px/1.9 Vazir; color: var(--paper); }
#endSave { top: 1270px; left: 140px; right: 140px; padding: 22px 0 26px; border-radius: 60px; background: var(--gold); color: var(--ink); text-align: center; font: 900 44px Vazir; }
#endIg { top: 1420px; font: 700 38px Manrope; letter-spacing: .3em; direction: ltr; }
#flash { background: #fff; opacity: 0; }
#grain { position: absolute; inset: 0; width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: .1; }
#vig { background: radial-gradient(ellipse 80% 64% at 50% 50%, transparent 58%, rgba(0,0,0,.5) 100%); }
.scene { position: absolute; inset: 0; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="photos"></div>
  <div class="layer" id="mosaic" style="display:none"></div>
  <svg id="gridSvg" viewBox="0 0 1080 1920" style="display:none"><line x1="360" y1="0" x2="360" y2="1920"/><line x1="720" y1="0" x2="720" y2="1920"/><line x1="0" y1="640" x2="1080" y2="640"/><line x1="0" y1="1280" x2="1080" y2="1280"/></svg>
  <div class="layer" id="vig"></div>
  <div class="layer" id="shadeTop"></div>
  <div class="layer" id="shadeBot"></div>

  <div class="scene" id="sHook">
    <div class="abs center sh" id="hookKick">عکاسی تبلیغاتی غذا · سودا رحیم‌پور</div>
    <div class="abs center sh" id="hookNum">۵ انتخاب</div>
    <div class="abs center sh" id="hookL1">که عکس غذا را</div>
    <div class="abs center sh" id="hookL2"><em>اشتهابرانگیزتر</em> می‌کند</div>
    <div class="abs center" id="hookTick"></div>
  </div>
  <div class="scene" id="sChap">
    <div class="abs" id="segs"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    <div class="abs center" id="kicker"></div>
    <div class="abs center sh" id="title"></div>
    <div class="abs" id="swatches"></div>
    <div class="abs sh" id="expl"></div>
  </div>
  <div class="scene" id="sMosaic">
    <div class="abs center sh" id="mosaicText"><div id="m1">همه‌ی این انتخاب‌ها</div><div id="m2"><em>پیش از فشردن شاتر</em></div><div id="m3">انجام می‌شوند.</div></div>
  </div>
  <div class="scene" id="sEnd">
    <div class="abs center sh" id="endName">سودا رحیم‌پور</div>
    <div class="abs center sh" id="endRole">عکاسی تبلیغاتی غذا و محصول</div>
    <div class="abs" id="endUrl">3evda.com</div>
    <div class="abs center sh" id="endList">استعلام قیمت آنلاین · رزرو<br>ارسال محصول از سراسر ایران به استودیو</div>
    <div class="abs" id="endSave">این ویدیو را برای پروژه‌ی بعدی ذخیره کنید</div>
    <div class="abs center sh" id="endIg">@3EVDA.R</div>
  </div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div class="layer" id="flash"></div>
</div>
<script src="build/manifest.js"></script>
<script src="build/kicks4.js"></script>
<script>
"use strict";
const M = window.MANIFEST;
for (const k in M.photos) { M.photos[k].src = "build/" + M.photos[k].src; M.photos[k].bg = "build/" + M.photos[k].bg; }
const B = 60 / window.BPM, BAR = 4 * B;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);
const eox = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eob = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const st = (el, o) => { for (const k in o) el.style[k] = o[k]; };
function kick(t) { let last = -9; for (const k of window.KICKS) { if (k <= t) last = k; else break; } return Math.exp(-(t - last) / 0.1); }

// ---- the five decisions. Overlay coordinates are in the photo's own pixels.
const PAL = { leaf: "#41621b", barberry: "#711f18", lemon: "#bb8826", slate: "#4f5253" };  // sampled from the dolmeh photo
const CH = [
  { photo: "corn", fa: "زاویه", en: "ANGLE", pan: [-40, -1100],
    expl: "نمای از بالا، کل چیدمان را خوانا می‌کند؛ خطِ مورب بلال‌ها نگاه را تا لیموها می‌برد.",
    marks: [
      { type: "line", d: "M 140 1460 L 1160 600", at: 0.5, label: "خط مورب", lx: 700, ly: 1110 },
      { type: "arrow", from: [760, 560], to: [760, 860], at: 0.9, label: "زاویه‌ی ۹۰ درجه · فلت‌لی", lx: 960, ly: 520 },
      { type: "circle", c: [1600, 880], r: 340, at: 2.3, label: "تکرارِ رنگ زرد", lx: 1640, ly: 540 },
    ] },
  { photo: "ash", fa: "نور", en: "LIGHT",
    expl: "نورِ پشت و کنار، بخار و براقیِ آش را دیدنی می‌کند؛<br>چیدمانِ اصیل و انتخابِ ظروفِ مناسب،<br>حس و حالِ بهتری به مخاطب می‌دهد.",
    marks: [
      { type: "arrow", from: [1150, 330], to: [870, 640], at: 0.5, label: "جهت نور", lx: 1180, ly: 640 },
      { type: "ellipse", c: [720, 700], rx: 290, ry: 110, at: 0.95, label: "بخار: داغ و تازه", lx: 520, ly: 620 },
    ] },
  { photo: "dolmeh", fa: "رنگ", en: "COLOUR", swatches: true,
    expl: "قرمز روی سبز دو رنگِ مکمل‌اند و نگاه را قفل می‌کنند.",
    marks: [
      { type: "circle", c: [1010, 1110], r: 300, at: 0.5, label: "زرشکِ قرمز", lx: 900, ly: 770 },
      { type: "circle", c: [430, 860], r: 210, at: 0.95, label: "قطره‌ی آب: تازگی", lx: 600, ly: 600 },
    ] },
  { photo: "ricecake-peanut", fa: "عمق میدان", en: "DEPTH OF FIELD",
    expl: "عمق میدانِ کم: پس‌زمینه محو می‌شود تا نگاه فقط روی محصول بماند.",
    marks: [
      { type: "bracket", x1: 270, y1: 1120, x2: 1270, y2: 1900, at: 0.5, label: "فوکوس: محصول", lx: 1250, ly: 1060 },
      { type: "rect", x1: 280, y1: 460, x2: 1330, y2: 820, at: 1.0, label: "پس‌زمینه‌ی محو", lx: 1330, ly: 885 },
    ] },
  { photo: "ricecake-pear", fa: "ترکیب‌بندی", en: "COMPOSITION", grid: true,
    expl: "سوژه روی خطوط یک‌سوم؛ نیمه‌ی گلابی فرم را تکرار می‌کند و قاب، ساده و تمیز می‌ماند.",
    marks: [
      { type: "circle", c: [870, 870], r: 480, at: 0.8, label: "سوژه‌ی اصلی", lx: 1340, ly: 1335 },
      { type: "circle", c: [430, 1610], r: 330, at: 1.25, label: "تکرار فرم", lx: 760, ly: 1352 },
    ] },
];
const T = { chap: 2 * BAR, chapLen: 2 * BAR, mosaic: 12 * BAR, end: 13 * BAR, loop: 15 * BAR - 0.6, total: 15 * BAR };

// ---- build one photo "wrap" per chapter: image cover-fitted, with an SVG overlay in photo pixels
const NS = "http://www.w3.org/2000/svg";
function build(ch) {
  const p = M.photos[ch.photo], s = Math.max(1080 / p.w, 1920 / p.h), dw = p.w * s, dh = p.h * s;
  const wrap = document.createElement("div"); wrap.className = "wrap";
  const cont = document.createElement("div"); cont.className = "cont";
  st(cont, { width: dw + "px", height: dh + "px", left: (1080 - dw) / 2 + "px", top: (1920 - dh) / 2 + "px" });
  cont.innerHTML = `<img src="${p.src}">`;
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${p.w} ${p.h}`); svg.setAttribute("preserveAspectRatio", "none");
  ch.els = [];
  for (const mk of ch.marks) {
    let d = "";
    if (mk.type === "line") d = mk.d;
    if (mk.type === "arrow") {
      const [x1, y1] = mk.from, [x2, y2] = mk.to, a = Math.atan2(y2 - y1, x2 - x1), h = 46 / s;
      d = `M ${x1} ${y1} L ${x2} ${y2} M ${x2 - h * Math.cos(a - 0.5)} ${y2 - h * Math.sin(a - 0.5)} L ${x2} ${y2} L ${x2 - h * Math.cos(a + 0.5)} ${y2 - h * Math.sin(a + 0.5)}`;
    }
    if (mk.type === "circle" || mk.type === "ellipse") {
      const [cx, cy] = mk.c, rx = mk.r || mk.rx, ry = mk.r || mk.ry;
      d = `M ${cx + rx} ${cy} A ${rx} ${ry} 0 1 1 ${cx - rx} ${cy} A ${rx} ${ry} 0 1 1 ${cx + rx} ${cy}`;
    }
    if (mk.type === "rect") d = `M ${mk.x1} ${mk.y1} H ${mk.x2} V ${mk.y2} H ${mk.x1} Z`;
    if (mk.type === "bracket") {
      const k = 120 / s, { x1, y1, x2, y2 } = mk;
      d = `M ${x1} ${y1 + k} V ${y1} H ${x1 + k} M ${x2 - k} ${y1} H ${x2} V ${y1 + k} M ${x2} ${y2 - k} V ${y2} H ${x2 - k} M ${x1 + k} ${y2} H ${x1} V ${y2 - k}`;
    }
    const path = document.createElementNS(NS, "path"); path.setAttribute("d", d);
    if (mk.type === "rect") path.setAttribute("stroke-dasharray", "1");
    svg.appendChild(path);
    const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = mk.label;
    // labels are anchored by their right edge (reading starts there), kept inside the visible frame later
    st(lbl, { right: (dw - mk.lx * s) + "px", top: (mk.ly * s - 34) + "px" });
    cont.appendChild(lbl);
    ch.els.push({ mk, path, lbl });
  }
  cont.appendChild(svg);
  wrap.appendChild(cont); $("photos").appendChild(wrap);
  ch.wrap = wrap; ch.cont = cont; ch.s = s; ch.dw = dw;
}
CH.forEach(build);
// the hook and the outro reuse the chapter photos without overlays
function showChapterPhoto(i, o = {}) {
  CH.forEach((ch, j) => { ch.wrap.style.display = j === i ? "block" : "none"; });
  if (i < 0) return;
  const ch = CH[i];
  st(ch.wrap, { transform: `scale(${o.s ?? 1})`, opacity: o.op ?? 1, filter: o.filter || "none" });
  if (ch.pan) ch.cont.style.left = (o.pan ?? (1080 - ch.dw) / 2) + "px";
  ch.els.forEach(e => { e.path.style.display = o.marks ? "block" : "none"; e.lbl.style.display = o.marks ? "block" : "none"; });
}
$("swatches").innerHTML = [["leaf", "سبز برگ"], ["barberry", "قرمز زرشک"], ["lemon", "زرد لیمو"], ["slate", "خاکستری زمینه"]]
  .map(([k, n]) => `<div class="sw"><i style="background:${PAL[k]}"></i><b>${n}</b><small>${PAL[k].toUpperCase()}</small></div>`).join("");
// outro mosaic: five vertical strips
const MOS = ["corn", "ash", "dolmeh", "ricecake-peanut", "ricecake-pear"];
MOS.forEach((n, i) => { const d = document.createElement("div"); d.className = "strip"; d.style.left = (i * 216) + "px"; d.innerHTML = `<img src="${M.photos[n].src}">`; $("mosaic").appendChild(d); });

const grainFrames = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement("canvas"); c.width = 540; c.height = 960;
  const g = c.getContext("2d"), im = g.createImageData(540, 960); let s = 3 + k * 911;
  for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = (s / 2147483647) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); grainFrames.push(c);
}
function only(id) { for (const s of ["sHook", "sChap", "sMosaic", "sEnd"]) $(s).style.display = s === id ? "block" : "none"; }
const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

function hook(t, alpha = 1) {
  only("sHook"); $("sHook").style.opacity = alpha;
  // the five photos flicker behind the title on each beat of the second bar
  const i = t < BAR ? 2 : Math.min(4, Math.floor((t - BAR) / (BAR / 5)));
  showChapterPhoto(alpha < 1 ? 2 : i, { s: 1.08 - t * 0.01, filter: "brightness(.55)", op: alpha < 1 ? alpha : 1 });
  const k = kick(t);
  st($("hookNum"), { transform: `scale(${1 + k * 0.02})` });
  const l1 = alpha < 1 ? 1 : prog(t, B, 0.3), l2 = alpha < 1 ? 1 : prog(t, 2 * B, 0.3);
  $("hookL1").style.clipPath = `inset(0 0 0 ${lerp(100, 0, eo(l1))}%)`;
  $("hookL2").style.clipPath = `inset(0 0 0 ${lerp(100, 0, eo(l2))}%)`;
  $("hookTick").textContent = t < BAR || alpha < 1 ? "" : ["01", "02", "03", "04", "05"][i - 0] + " / 05";
  $("shadeTop").style.opacity = $("shadeBot").style.opacity = 0.6;
}

function chapter(t) {
  only("sChap");
  const i = Math.min(4, Math.floor((t - T.chap) / T.chapLen)), u = t - T.chap - i * T.chapLen, ch = CH[i];
  const exitP = prog(u, T.chapLen - 0.3, 0.3);
  const pan = ch.pan ? lerp(ch.pan[0], ch.pan[1], eio(clamp(u / (T.chapLen - 0.2)))) : undefined;
  showChapterPhoto(i, { s: lerp(1.14, 1.02, eox(clamp(u / 0.7))) - u * 0.004 + exitP * 0.06, marks: true, pan });
  $("flash").style.opacity = Math.max(0, 0.85 - u * 6);
  // overlays draw in, labels slide in after them
  ch.els.forEach(({ mk, path, lbl }) => {
    const L = path.getTotalLength(), p = eio(prog(u, mk.at, 0.55));
    if (mk.type === "rect") { path.style.strokeDasharray = `${18 / ch.s} ${14 / ch.s}`; path.style.opacity = p; }
    else { path.style.strokeDasharray = `${L}`; path.style.strokeDashoffset = `${L * (1 - p)}`; }
    const lp = prog(u, mk.at + 0.35, 0.3);
    // on a panning shot, a label fades out as its anchor leaves the frame
    const edge = ch.pan ? clamp((mk.lx * ch.s + pan - 300) / 150) * clamp((1080 - mk.lx * ch.s - pan + 40) / 80) : 1;
    st(lbl, { opacity: (lp > 0 ? 1 : 0) * (1 - exitP) * edge, transform: `scale(${lerp(0.6, 1, eob(lp))})` });
    path.style.opacity = (mk.type === "rect" ? p : 1) * (1 - exitP);
  });
  $("gridSvg").style.display = ch.grid ? "block" : "none";
  if (ch.grid) [...$("gridSvg").children].forEach((ln, j) => { const L = j < 2 ? 1920 : 1080, p = eio(prog(u, 0.3 + j * 0.1, 0.5));
    st(ln, { strokeDasharray: L, strokeDashoffset: L * (1 - p), opacity: 1 - exitP }); });
  // segments (story-style progress)
  [...$("segs").children].forEach((seg, j) => { seg.firstElementChild.style.width = (j < i ? 100 : j === i ? clamp(u / T.chapLen) * 100 : 0) + "%"; });
  $("kicker").textContent = `CHOICE 0${i + 1} / 05 · ${ch.en}`;
  $("title").innerHTML = `<span>${fa("0" + (i + 1))}</span>${ch.fa}`;
  const tp = prog(u, 0.12, 0.4);
  st($("title"), { clipPath: `inset(0 0 0 ${lerp(100, 0, eo(tp))}%)`, transform: `translateY(${lerp(30, 0, eo(tp))}px)` });
  $("expl").innerHTML = ch.expl;
  const ep = prog(u, 1.7, 0.45);
  st($("expl"), { clipPath: `inset(0 0 0 ${lerp(100, 0, eo(ep))}%)`, opacity: 1 - exitP });
  $("swatches").style.display = ch.swatches ? "flex" : "none";
  if (ch.swatches) [...$("swatches").children].forEach((sw, j) => { const p = prog(u, 1.2 + j * 0.12, 0.3); st(sw, { opacity: p > 0 ? 1 - exitP : 0, transform: `translateY(${lerp(60, 0, eob(p))}px)` }); });
  $("shadeTop").style.opacity = $("shadeBot").style.opacity = 1;
}

function mosaic(t) {
  only("sMosaic"); showChapterPhoto(-1); $("gridSvg").style.display = "none";
  const u = t - T.mosaic, k = kick(t);
  $("mosaic").style.display = "block";
  [...$("mosaic").children].forEach((d, j) => {
    const p = eox(prog(u, j * 0.06, 0.6));
    st(d, { transform: `translateY(${(j % 2 ? -1 : 1) * lerp(1920, 0, p)}px)`, filter: `brightness(${lerp(1, 0.45, prog(u, 0.6, 0.4))})` });
    d.firstElementChild.style.transform = `translateX(-50%) scale(${1.05 + k * 0.01})`;
  });
  $("flash").style.opacity = Math.max(0, 0.9 - u * 4);
  ["m1", "m2", "m3"].forEach((id, j) => { const p = prog(u, 0.7 + j * 0.25, 0.35); $(id).style.clipPath = `inset(0 0 0 ${lerp(100, 0, eo(p))}%)`; });
  $("shadeTop").style.opacity = $("shadeBot").style.opacity = 0.5;
}

function endCard(t) {
  only("sEnd"); $("mosaic").style.display = "none"; $("gridSvg").style.display = "none";
  showChapterPhoto(1, { s: 1.15 + (t - T.end) * 0.01, filter: "blur(26px) brightness(.32)" });
  const u = t - T.end, k = kick(t);
  $("flash").style.opacity = Math.max(0, 0.7 - u * 3);
  const line = (id, a) => { const p = prog(u, a, 0.4); st($(id), { clipPath: `inset(0 0 0 ${lerp(100, 0, eo(p))}%)`, transform: `translateY(${lerp(24, 0, eo(p))}px)` }); };
  line("endName", 0.05); line("endRole", 0.3); line("endList", 0.8); line("endIg", 1.3);
  const up = prog(u, 0.55, 0.35); st($("endUrl"), { opacity: up > 0 ? 1 : 0, transform: `scale(${lerp(0.85, 1, eob(up)) * (1 + k * 0.01)})` });
  const sp = prog(u, 1.1, 0.35); st($("endSave"), { opacity: sp > 0 ? 1 : 0, transform: `scale(${lerp(0.6, 1, eob(sp)) * (1 + k * 0.02)})` });
  $("shadeTop").style.opacity = $("shadeBot").style.opacity = 0.4;
  const lp = eio(prog(t, T.loop, T.total - T.loop));
  $("sEnd").style.opacity = 1 - lp;
  if (lp > 0) { hook(0, lp); $("sEnd").style.display = "block"; }
}

function renderAt(t) {
  $("flash").style.opacity = 0; $("sEnd").style.opacity = 1; $("sHook").style.opacity = 1; $("mosaic").style.display = "none";
  if (t < T.chap) { $("gridSvg").style.display = "none"; hook(t); }
  else if (t < T.mosaic) chapter(t);
  else if (t < T.end) mosaic(t);
  else endCard(t);
  $("grain").getContext("2d").drawImage(grainFrames[Math.floor(t * 30) % 6], 0, 0);
}
window.renderAt = renderAt;
window.DURATION = T.total;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => null)));
  renderAt(0); return true;
})();
</script>
